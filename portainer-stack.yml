# Follow the latest successfully published build of the main app.
# Configure GHCR credentials in Portainer if the package requires authentication.
services:
  converter:
    image: ${APP_IMAGE:-ghcr.io/markspawn/odoo2paradigm:main}
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:${HOST_PORT:-8091}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD to a password of at least 12 characters}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /data
    volumes:
      - converter_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
    init: true
volumes:
  converter_data:
