name: Test and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - name: Build and smoke-test Docker image
        run: |
          docker build -t p10-converter:test .
          export APP_PASSWORD="ci-$(openssl rand -hex 20)"
          docker run -d --name p10-smoke -p 127.0.0.1:18080:8080 -e APP_PASSWORD --read-only --tmpfs /tmp:rw,size=128m -v p10-smoke-data:/data p10-converter:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18080/healthz
          docker restart p10-smoke
          sleep 3
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:18080/healthz
      - name: Docker logs on failure
        if: failure()
        run: docker logs p10-smoke || true
      - name: Clean up
        if: always()
        run: |
          docker rm -f p10-smoke || true
          docker volume rm p10-smoke-data || true
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
